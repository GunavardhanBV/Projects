    function renderQuestions() {
      ["basic", "intermediate", "advanced"].forEach(level => {
        const container = document.getElementById(level + "Questions");
        questions[level].forEach((q, i) => {
          const id = `${level}_${i}`;
          const div = document.createElement("div");
          div.className = "question";
          div.innerHTML = `<p>${i + 1}. ${q.q}</p>` + q.options.map((opt, j) =>
            `<label><input type="radio" name="${id}" value="${j}"> ${opt}</label>`
          ).join("");
          container.appendChild(div);
        });
      });
    }

    function submitQuiz() {
      let total = 0, correct = 0;
      for (let level in questions) {
        questions[level].forEach((q, i) => {
          total++;
          const selected = document.querySelector(`input[name="${level}_${i}"]:checked`);
          if (selected && parseInt(selected.value) === q.answer) correct++;
        });
      }
      const score = (correct / total) * 100;
      const result = document.getElementById("result");
      result.style.color = score >= 85 ? "green" : "red";
      result.textContent = score >= 85 ? `✅ Quiz Passed! Score: ${score.toFixed(2)}%` : `❌ Quiz Failed. Score: ${score.toFixed(2)}%`;
    }

    function switchTab(tabId) {
      document.querySelectorAll(".quiz-section").forEach(sec => sec.classList.remove("active"));
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.getElementById(tabId).classList.add("active");
      event.target.classList.add("active");
